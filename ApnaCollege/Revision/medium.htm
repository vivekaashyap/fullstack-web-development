<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medium</title>
    <style>
        *{
            margin: 0;
            padding:0;
            box-sizing: border-box;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: yellow;
        }
        .nav-links{
            display: flex;
            list-style: none;
            gap: 20px;
        }
        li{
            padding: 0px;
        }
        a{
            text-decoration: none;
            color: #000;
        }
        .get{
            background-color: black;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            display: inline-block; 
        }
        h2{
            font-size: 30px;
        }
    </style>
</head>
<body>
    <nav>
        <h2>Medium</h2>
        <ul class="nav-links">
            <li><a href="#">Our Story</a></li>
            <li><a href="#">Membership</a></li>
            <li><a href="#">Write</a></li>
            <li><a href="#">Sign In</a></li>
            <li><a class="get" href="#">Get Started</a></li>
        </ul>
    </nav>
</body>
</html>
