<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        img {
            animation: fadeimg 3s infinite alternate;
        }

        @keyframes fadeimg {
            0% {
                filter: grayscale(100%);
            }

            25% {
                filter: grayscale(75%);
            }

            50% {
                filter: grayscale(50%);
            }

            75% {
                filter: grayscale(25%);
            }

            100% {
                filter: grayscale(0%);
            }
        }
    </style>
</head>

<body>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6vh6yMErik57bz2XSP9o2Tjw9kn0pV6tRVZ866Bn59rhLNosQN66GUJg&s=10"
        alt="animal">
</body>

</html>
